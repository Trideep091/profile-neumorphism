<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Design</title>

    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css" integrity="sha512-+4zCK9k+qNFUR5X+cKL9EIR+ZOhtIloNl9GIKS57V1MyNsYpYcUrUeQc9vNfzsWfV28IaLL3i96P9sdNyeRssA==" crossorigin="anonymous" />
</head>
<body>
    <div class="profile">
        <div class="upper-part">
            
            <div class="icons-main">
                <i class="fas arrow fa-arrow-left"></i>
            </div>

         <div class="img">
             <img src="Img.jpg" alt="My Photo">
         </div>

         <div class="name">
             Vipin Arya Narang
         </div>

         <div class="details">
             Aspiring AI & ML Engineer
         </div>
            
        </div>

        <div class="icon">
            <i class="fab fb fa-facebook-f"></i>
            <i class="fab ins fa-instagram"></i>
            <i class="fab tw fa-twitter"></i>
            <i class="fab yo fa-youtube"></i>
        </div>

        <div class="more">
            <button>Message</button>
            <button>About Me</button>
        </div>

        <div class="icon-mr">
            <span><i class="fas no_cl fa-share"></i>20K</span>
            <span><i class="fas no_cl fa-comments"></i> 205k</span>
            <span><i class="far no_cl fa-heart"></i> 2015k</span>
        </div>
    </div>
</body>
</html>
